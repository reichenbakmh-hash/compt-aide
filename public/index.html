const FS={tva:[["Principe","Vous collectez la TVA sur vos ventes (compte 44571) et vous récupérez celle de vos achats (44566). TVA à payer = TVA collectée − TVA déductible. Si le résultat est négatif, vous avez un crédit de TVA (44567), reportable ou remboursable."],["Taux","20 % : taux normal. 10 % : restauration, transports de voyageurs, travaux d’amélioration du logement. 5,5 % : produits alimentaires, livres, rénovation énergétique. 2,1 % : médicaments remboursables, presse. Les DOM ont des taux particuliers."],["Quand la TVA est-elle due ?","Livraison de biens : à la livraison. Prestation de services : à l’encaissement, sauf option pour les débits."],["Les trois régimes","Franchise en base : ni TVA facturée ni TVA récupérée, jusqu’à 37 500 € de chiffre d’affaires pour les services et 85 000 € pour les ventes en 2026 (seuils majorés : 41 250 € et 93 500 €). Mention obligatoire : « TVA non applicable, article 293 B du CGI ». Réel simplifié : une déclaration annuelle (CA12) et deux acomptes. Réel normal : une déclaration mensuelle ou trimestrielle (CA3)."],["Autoliquidation","C’est le client qui déclare la TVA à la place du fournisseur : sous-traitance dans le bâtiment, certains achats auprès de fournisseurs de l’Union européenne."],["TVA non récupérable","Certaines dépenses ne donnent pas droit à déduction : la plupart des véhicules de tourisme, les dépenses sans lien avec l’activité taxée, les cadeaux au-delà d’un petit plafond."]],
ben:[["Impôt sur les sociétés (IS)","Taux normal : 25 %. Taux réduit de 15 % sur les 42 500 premiers euros de bénéfice pour les PME dont le chiffre d’affaires est inférieur à 10 M€, dont le capital est entièrement libéré et détenu à 75 % au moins par des personnes physiques. Quatre acomptes (15 mars, 15 juin, 15 septembre, 15 décembre pour un exercice civil) si l’impôt de l’année précédente dépasse 3 000 €, puis le solde au plus tard le 15 mai."],["Résultat comptable et résultat fiscal","Le bénéfice imposable part du résultat comptable, corrigé par des réintégrations (amendes, amortissements excédentaires, charges somptuaires…) et des déductions. Tableau de passage : formulaire 2058-A."],["Impôt sur le revenu (IR)","Entreprises individuelles et sociétés de personnes : le bénéfice est imposé à l’IR dans la déclaration personnelle, en BIC (commerce, artisanat) ou en BNC (professions libérales)."],["Micro-entreprise","Plafonds 2026 à 2028 : 203 100 € (vente de marchandises) et 83 600 € (prestations de services). Abattements forfaitaires : 71 % (vente), 50 % (services BIC), 34 % (BNC). Pas de bilan : un livre des recettes et un registre des achats suffisent."],["Déficits","Un déficit se reporte sur les bénéfices des années suivantes, avec un plafonnement au-delà d’un million d’euros. Sur option, il peut aussi être reporté sur l’exercice précédent, dans une limite."],["Dividendes","Distribués après approbation des comptes, à partir du bénéfice et des réserves. Pour les associés personnes physiques : prélèvement forfaitaire ou barème, taux à vérifier chaque année."]],
tax:[["Cotisation foncière des entreprises (CFE)","Due chaque année par presque toutes les entreprises, selon la valeur locative des locaux, avec une base minimale fixée par la commune. Acompte le 15 juin si elle dépasse 3 000 €, solde le 15 décembre."],["CVAE","Concerne les entreprises dont le chiffre d’affaires dépasse 500 000 €. Taux maximal de 0,28 % en 2026, suppression progressive prévue jusqu’en 2030. Deux acomptes (15 juin et 15 septembre) si la cotisation dépasse 1 500 €."],["Cotisations sociales","L’employeur paie les cotisations patronales (URSSAF, retraite, chômage…) en plus des cotisations salariales retenues sur le salaire. Tout se déclare chaque mois par la DSN."],["La DSN","Déclaration sociale nominative mensuelle : au plus tard le 5 du mois suivant pour les entreprises de 50 salariés et plus, le 15 pour les autres."],["Du brut au net","Salaire brut − cotisations salariales = net avant impôt. Net avant impôt − prélèvement à la source = net à payer. Comptes : 641 (rémunérations), 645 (charges sociales), 421 (personnel), 431 (sécurité sociale), 4421 (prélèvement à la source)."],["Formation et apprentissage","Financés par des contributions calculées sur la masse salariale et collectées avec les cotisations sociales."]],
obl:[["Comptes annuels","Bilan, compte de résultat et annexe, établis à chaque clôture. Les sociétés les font approuver dans les six mois suivant la clôture, puis les déposent au greffe du tribunal de commerce."],["Conservation","Pièces et livres comptables : 10 ans. Documents fiscaux : 6 ans."],["Le FEC","Fichier des écritures comptables : export normalisé à remettre à l’administration en cas de contrôle. Les logiciels de comptabilité le génèrent."],["Mentions des factures","Identité et SIREN du vendeur, numéro unique et chronologique, date, désignation, quantité, prix unitaire HT, taux et montant de TVA, total TTC, date d’échéance, conditions d’escompte, pénalités de retard et indemnité forfaitaire de 40 € pour frais de recouvrement. La réforme ajoute à partir du 1er septembre 2026 : le SIREN du client, l’adresse de livraison si elle diffère, la nature de l’opération et, le cas échéant, l’option pour la TVA sur les débits."],["Délais de paiement","Sauf accord, 30 jours après la réception de la marchandise ou l’exécution du service. Maximum 60 jours après la date de facture, ou 45 jours fin de mois."],["Facturation électronique","Depuis le 1er septembre 2026, toutes les entreprises assujetties à la TVA doivent pouvoir recevoir des factures électroniques. L’émission est obligatoire le 1er septembre 2026 pour les grandes entreprises et les ETI, et le 1er septembre 2027 pour les PME, TPE et micro-entreprises, avec le e-reporting."],["Logiciels de caisse","Ils doivent garantir l’inaltérabilité des données : certification NF 525 ou attestation de l’éditeur."]],
cal:[["Chaque mois","TVA (CA3) : entre le 15 et le 24 du mois suivant, selon la date fixée par votre service. DSN : le 5 ou le 15."],["15 mars, 15 juin, 15 septembre, 15 décembre","Acomptes d’impôt sur les sociétés."],["Début mai","Liasse fiscale et déclaration annuelle de TVA (CA12). Solde de l’IS au plus tard le 15 mai."],["15 juin et 15 septembre","Acomptes de CVAE, si la cotisation dépasse 1 500 €. Acompte de CFE le 15 juin, si elle dépasse 3 000 €."],["Juillet et décembre","Acomptes de TVA au réel simplifié."],["15 décembre","Solde de la CFE."],["1er septembre 2026","Réception des factures électroniques obligatoire pour toutes les entreprises."],["1er septembre 2027","Émission des factures électroniques obligatoire pour les PME, TPE et micro-entreprises."]]};

const LES=[
{t:"1. La partie double",p:["Chaque opération touche au moins deux comptes : l’un est débité, l’autre crédité, pour le même montant total.","Débit = emploi (ce que l’entreprise reçoit, possède ou consomme). Crédit = ressource (d’où vient la valeur : dette, apport, vente).","Règle pratique : l’actif et les charges augmentent au débit ; les dettes, le capital et les produits augmentent au crédit."],l:[["512","Banque",5000,0],["101","Capital",0,5000]],n:"Exemple : les associés apportent 5 000 € en capital."},
{t:"2. Les journaux",p:["Chaque pièce est classée dans un journal : Achats (AC), Ventes (VT), Banque (BQ), Caisse (CA), Opérations diverses (OD).","Les OD servent aux écritures sans mouvement de trésorerie : amortissements, régularisations, paie.","Le grand livre regroupe les mêmes écritures par compte ; la balance vérifie que total débit = total crédit."]},
{t:"3. La facture d’achat pas à pas",p:["1. Réception : relever fournisseur, date, numéro, HT, TVA, TTC.","2. Contrôle : la facture correspond-elle à la commande et à la livraison ?","3. Imputation : choisir le compte de charge (ou d’immobilisation) et la TVA.","4. Saisie au journal des achats, puis validation.","5. Règlement : 401 au débit, 512 au crédit, puis lettrage."],l:[["607","Achats de marchandises",1200,0],["44566","TVA déductible",240,0],["401","Fournisseurs",0,1440]],n:"Achat de 1 200 € HT, TVA 20 %."},
{t:"4. Lettrage et rapprochement bancaire",p:["Lettrer, c’est associer une facture à son règlement sur un compte de tiers (401 ou 411) : un compte entièrement lettré a un solde nul.","Le rapprochement bancaire compare le compte 512 au relevé de la banque. Les écarts viennent souvent de chèques émis non encaissés, de frais ou d’agios non comptabilisés.","Méthode : pointer ligne à ligne, lister les écarts, passer les écritures manquantes."]},
{t:"5. Les écritures de fin d’année",p:["Indépendance des exercices : une charge ou un produit se rattache à l’exercice qui le concerne, pas à la date de paiement.","Amortissements : 681 / 28x. Factures non parvenues : 408. Produits à recevoir : 418. Charges constatées d’avance : 486. Produits constatés d’avance : 487.","Ces écritures sont souvent contre-passées à l’ouverture de l’exercice suivant."],l:[["486","Charges constatées d’avance",900,0],["616","Primes d’assurances",0,900]],n:"Assurance annuelle de 1 200 € payée au 1er octobre : 9 mois, soit 900 €, concernent l’exercice suivant."},
{t:"6. Le quotidien du collaborateur comptable",p:["Missions : saisir et contrôler les pièces, rapprocher la banque, suivre clients et fournisseurs, préparer la déclaration de TVA, participer aux situations intermédiaires et au bilan.","Qualités attendues : rigueur, organisation, respect des délais, confidentialité, veille sur la réglementation.","Progression habituelle : assistant comptable, collaborateur comptable, puis chef de mission ou responsable comptable."]},
{t:"7. Immobilisations et amortissement",p:["Une immobilisation est un bien durable détenu pour servir l’activité (ordinateur, véhicule, brevet). Elle est enregistrée en classe 2 à son coût d’acquisition, hors TVA récupérable.","L’amortissement répartit ce coût sur la durée d’utilisation. En linéaire : dotation annuelle = valeur ÷ durée (3 000 € ÷ 4 ans = 750 € par an).","Écriture annuelle : débit 681, crédit 28x. Valeur nette comptable = coût d’acquisition − amortissements cumulés."],l:[["2183","Matériel de bureau et informatique",3000,0],["44562","TVA déductible sur immobilisations",600,0],["404","Fournisseurs d’immobilisations",0,3600]],n:"Achat d’un ordinateur de 3 000 € HT, TVA 20 %, à crédit."},
{t:"8. La paie dans les comptes",p:["Le salaire brut est une charge : compte 641. Les cotisations salariales retenues sont dues aux organismes sociaux : compte 431. Le net à payer au salarié passe par le compte 421.","Les cotisations patronales sont une charge en plus : 645 au débit, 431 au crédit.","Le logiciel de paie fournit un journal de paie : le collaborateur comptable le contrôle, puis l’intègre en comptabilité."],l:[["641","Rémunérations du personnel",2500,0],["421","Personnel, rémunérations dues",0,1950],["431","Sécurité sociale",0,550]],n:"Exemple simplifié (hors cotisations patronales) : brut 2 500 €, cotisations salariales 550 €, net 1 950 €."},
{t:"9. De la balance au bilan",p:["La balance vérifie que total débit = total crédit et liste les soldes de chaque compte.","Les classes 1 à 5 alimentent le bilan ; les classes 6 et 7 le compte de résultat.","Résultat = produits (classe 7) − charges (classe 6). Un solde positif est un bénéfice (120), un solde négatif une perte (129).","Le bilan présente ce que l’entreprise possède (actif) et l’origine de ses ressources (passif) : total actif = total passif."]},
{t:"10. Repérer les erreurs",p:["Erreurs fréquentes : débit et crédit inversés, TVA oubliée, pièce saisie sur la mauvaise période, facture saisie deux fois.","Contrôles utiles : balance équilibrée, caisse (compte 53) jamais créditrice, fournisseurs (401) normalement créditeurs, clients (411) normalement débiteurs.","Le compte d’attente 471 doit être soldé : un mouvement qui y reste est une écriture non justifiée."]},{t:"11. La déclaration de TVA (CA3) pas à pas",p:["Au régime du réel normal, la TVA se déclare chaque mois sur le formulaire CA3, à une date limite fixée pour l’entreprise, en général entre le 15 et le 24 du mois suivant.","Principe : TVA collectée (44571) moins TVA déductible (44566 sur achats et charges, 44562 sur immobilisations). Résultat positif : TVA à payer. Résultat négatif : crédit de TVA (44567).","Sur les prestations de services, la TVA est exigible à l’encaissement ; sur les livraisons de biens, à la livraison.","Écriture de liquidation en fin de mois, puis règlement : débit 44551 et crédit 512."],l:[["44571","TVA collectée",600,0],["44566","TVA déductible",0,240],["44551","TVA à décaisser",0,360]],n:"TVA collectée 600 €, déductible 240 € : 360 € à payer."},
{t:"12. Le rapprochement bancaire chiffré",p:["Solde du relevé : 10 000 €. Un chèque de 800 € émis n’est pas encore débité : le solde corrigé du relevé est 9 200 €.","Solde du compte 512 en comptabilité : 9 250 €. L’écart de 50 € vient de frais bancaires prélevés et non comptabilisés.","On passe l’écriture manquante : le compte 512 passe à 9 200 €, identique au relevé corrigé."],l:[["627","Services bancaires et assimilés",50,0],["512","Banque",0,50]],n:"Frais bancaires de 50 € à enregistrer."},
{t:"13. Checklist de clôture annuelle",p:["1. Lettrer et justifier les comptes clients et fournisseurs.","2. Rapprocher la banque au 31 décembre et justifier la caisse.","3. Passer les amortissements (681 / 28x).","4. Rattacher les charges et produits à l’exercice : factures non parvenues (408), produits à recevoir (418), charges constatées d’avance (486), produits constatés d’avance (487).","5. Valoriser les stocks et constater les provisions éventuelles.","6. Solder la TVA, vérifier le compte d’attente 471, éditer la balance puis le bilan et le compte de résultat."]},
{t:"14. Les pièces justificatives",p:["Aucune écriture sans pièce : facture, relevé bancaire, contrat, bulletin de paie, note de frais.","À contrôler sur une facture fournisseur : identité du fournisseur, numéro et date, montants HT, TVA et TTC, correspondance avec la commande.","Les documents comptables et leurs pièces se conservent 10 ans. Classez-les avec la même numérotation que les écritures pour les retrouver vite en cas de contrôle."]},
{t:"15. Écritures courantes à connaître",p:["Avoir reçu d’un fournisseur : on inverse la facture d’origine.","Règlement client : débit 512, crédit 411. Frais bancaires : débit 627, crédit 512, sans TVA.","Acompte versé à un fournisseur : compte 4091. Acompte reçu d’un client : compte 4191.","Apport en capital : débit 512, crédit 101."],l:[["401","Fournisseurs",120,0],["607","Achats de marchandises",0,100],["44566","TVA déductible",0,20]],n:"Avoir de 100 € HT reçu d’un fournisseur, TVA 20 %."}];
